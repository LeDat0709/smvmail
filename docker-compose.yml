version: '3.8'

services:
  smvmail:
    build: .
    container_name: smvmail
    network_mode: "host"
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS must be set in .env}
      - DEBUG=0
      - PORT=5000
      - DB_PATH=/app/data/smvmail.db
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_USER=${DB_USER:-mailuser}
      - DB_PASS=${DB_PASS:?DB_PASS must be set in .env}
      - IMAP_HOST=${IMAP_HOST:-127.0.0.1}
      - IMAP_PORT=${IMAP_PORT:-143}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s